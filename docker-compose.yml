# ===========================================
# Egoli Pos - Docker Compose
# ===========================================
# Déploiement complet : MongoDB + Backend (FastAPI) + Frontend (React/Nginx)
# Fonctionne aussi bien sur un PC local que sur un serveur cloud.
#
# Avant de lancer, copiez .env.example en .env et adaptez les valeurs.
# Démarrage : docker compose up -d --build
# ===========================================

services:
  # Base de données MongoDB
  mongodb:
    image: mongo:6.0
    container_name: egoli_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=${DB_NAME:-egoli_pos}
    networks:
      - egoli_network

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: egoli_backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=${DB_NAME:-egoli_pos}
      - JWT_SECRET=${JWT_SECRET:?Definir JWT_SECRET dans .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      - mongodb
    networks:
      - egoli_network

  # Frontend React (servi par Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # IMPORTANT : l'URL du backend est figée AU BUILD pour une app React (CRA).
        # En local : http://localhost:8001
        # En cloud : https://api.votre-domaine.com
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
    container_name: egoli_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - egoli_network

volumes:
  mongodb_data:

networks:
  egoli_network:
    driver: bridge
